[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.26,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "ruff>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
