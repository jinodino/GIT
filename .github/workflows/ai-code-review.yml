name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted agent from base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-agent
          persist-credentials: false

      - name: Check out PR files for analysis
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-files
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install trusted dependencies
        run: python -m pip install ./trusted-agent

      - name: Review PR and maintain comment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_ROOT: ${{ github.workspace }}/pr-files
          PYTHONPATH: ${{ github.workspace }}/trusted-agent/src
          REFLECTION_ROUNDS: ${{ vars.REFLECTION_ROUNDS || '1' }}
        run: python -m code_review_agent.github.pr_reviewer
